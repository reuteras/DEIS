[tool.uv.workspace]
members = ["bin", "ingest", "web"]

[tool.uv]
# preshed 3.0.14 breaks spaCy 3.8.16 tokenizer loading
# (OverflowError in Tokenizer._flush_specials). Drop once fixed upstream.
constraint-dependencies = ["preshed==3.0.13"]

[tool.ruff]
# Allow lines to be as long as 120 characters.
line-length = 120
# Vendored third-party scripts (see docs/IMPROVEMENTS.md item 10) - not ours
# to reformat.
extend-exclude = ["downloader/creatorrc"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pip>=26.2.1",
    "pytest>=8.3.4",
    "ruff>=0.16.5",
]
