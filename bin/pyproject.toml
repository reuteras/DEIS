[project]
name = "deis-bin"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "en-core-web-sm",
    "py3langid==0.3.0",
    "rich>=15.0.0",
    "spacy==3.8.16",
    "sv-core-news-sm",
    "textual>=8.2.8",
    "tqdm>=4.68.4",
]

[project.scripts]
deis = "deis:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Flat scripts (deis.py, pii.py, ...), not a src/<pkg>/ layout - each
# installed as its own top-level module, matching how deis.py already
# finds its siblings (pii/simhash/entities) via a sys.path.insert of its
# own directory, deliberately not package-relative imports (see its own
# comment) - that only keeps working if they land next to each other the
# same way in an installed wheel too.
[tool.hatch.build.targets.wheel]
include = ["*.py"]

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }
sv-core-news-sm = { url = "https://github.com/explosion/spacy-models/releases/download/sv_core_news_sm-3.8.0/sv_core_news_sm-3.8.0-py3-none-any.whl" }
